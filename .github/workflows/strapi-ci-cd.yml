name: Strapi CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "cms/**"
      - "infra/strapi/**"
      - ".github/workflows/strapi-ci-cd.yml"
  push:
    branches: [main]
    paths:
      - "cms/**"
      - "infra/strapi/**"
      - ".github/workflows/strapi-ci-cd.yml"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Deploy environment
        options:
          - dev
          - prod
        required: true
      image_tag:
        type: string
        description: Image tag (git SHA or semantic) to deploy
        required: true
      run_migrations:
        type: boolean
        description: Run the configured migration command before deploying?
        default: true
      promote_only:
        type: boolean
        description: Skip the ECS service rollout (retag image alias only)
        default: false

permissions:
  contents: read

concurrency:
  group: strapi-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  STRAPI_AWS_REGION: ${{ vars.STRAPI_AWS_REGION }}
  STRAPI_ECR_REGISTRY: ${{ vars.STRAPI_ECR_REGISTRY }}
  STRAPI_ECR_REPOSITORY: ${{ vars.STRAPI_ECR_REPOSITORY }}

jobs:
  detect:
    name: Detect Strapi workspace
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required repository variables exist
        run: |
          set -euo pipefail
          missing=0
          for name in STRAPI_AWS_REGION STRAPI_ECR_REGISTRY STRAPI_ECR_REPOSITORY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not defined. Add a repository variable named $name before running this workflow."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Inspect Strapi workspace
        id: inspect
        run: |
          if [ -f cms/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Strapi workspace missing::cms/package.json was not found. Skipping Strapi CI/CD jobs."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Strapi quality gate
    needs: detect
    if: needs.detect.outputs.ready == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "cms/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: cms
        env:
          CI: "true"

      - name: Lint
        run: npm run lint --if-present
        working-directory: cms
        env:
          CI: "true"

      - name: Typecheck
        run: npm run typecheck --if-present
        working-directory: cms
        env:
          CI: "true"

      - name: Validate Strapi schemas
        run: npm run schema:validate --if-present
        working-directory: cms
        env:
          CI: "true"

      - name: Tests
        run: npm run test --if-present
        working-directory: cms
        env:
          CI: "true"

      - name: Build admin bundle
        run: npm run build --if-present
        working-directory: cms
        env:
          CI: "true"

  build:
    name: Build and push image
    needs: detect
    if: needs.detect.outputs.ready == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image-tag: ${{ steps.metadata.outputs.image_tag }}
      image-digest: ${{ steps.metadata.outputs.image_digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STRAPI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.STRAPI_AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build-image
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          docker build \
            --file Dockerfile \
            --tag "${STRAPI_ECR_REGISTRY}/${STRAPI_ECR_REPOSITORY}:${IMAGE_TAG}" \
            .
        working-directory: cms

      - name: Push image
        run: |
          set -euo pipefail
          docker push "${STRAPI_ECR_REGISTRY}/${STRAPI_ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Query image digest
        id: digest
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${STRAPI_ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "None" ]; then
            echo "::error::Failed to resolve image digest for ${IMAGE_TAG}"
            exit 1
          fi
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Record metadata outputs
        id: metadata
        run: |
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${{ steps.digest.outputs.image_digest }}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.STRAPI_ECR_REGISTRY }}/${{ env.STRAPI_ECR_REPOSITORY }}
          subject-digest: ${{ steps.digest.outputs.image_digest }}

  deploy-dev:
    name: Deploy to dev
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: strapi-dev
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
      IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
      RUN_MIGRATIONS: "true"
      STRAPI_CLUSTER_ARN: ${{ vars.STRAPI_CLUSTER_ARN }}
      STRAPI_SERVICE_NAME: ${{ vars.STRAPI_SERVICE_NAME }}
      STRAPI_HEALTHCHECK_URL: ${{ vars.STRAPI_HEALTHCHECK_URL }}
      STRAPI_REVALIDATE_URL: ${{ vars.STRAPI_REVALIDATE_URL }}
      STRAPI_MIGRATION_COMMAND: ${{ vars.STRAPI_MIGRATION_COMMAND }}
      STRAPI_MIGRATION_COMMAND_SECRET_ARN: ${{ vars.STRAPI_MIGRATION_COMMAND_SECRET_ARN }}
      STRAPI_REVALIDATE_SECRET_ARN: ${{ vars.STRAPI_REVALIDATE_SECRET_ARN }}
      STRAPI_DEPLOYMENT_WEBHOOK_URL: ${{ vars.STRAPI_DEPLOYMENT_WEBHOOK_URL }}
      STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN: ${{ vars.STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN }}
      STRAPI_CODEDEPLOY_APPLICATION: ${{ vars.STRAPI_CODEDEPLOY_APPLICATION }}
      STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP }}
      STRAPI_TASK_DEFINITION_FAMILY: ${{ vars.STRAPI_TASK_DEFINITION_FAMILY }}
      STRAPI_CONTAINER_NAME: ${{ vars.STRAPI_CONTAINER_NAME }}
      STRAPI_CONTAINER_PORT: ${{ vars.STRAPI_CONTAINER_PORT }}
      STRAPI_SMOKE_TEST_URLS: ${{ vars.STRAPI_SMOKE_TEST_URLS }}
      STRAPI_DEPLOYMENT_WEBHOOK_TOKEN: ""
      DEPLOYMENT_ENVIRONMENT: "dev"
      PROMOTE_ONLY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          set -euo pipefail
          required_env=(
            STRAPI_CLUSTER_ARN
            STRAPI_SERVICE_NAME
          )
          for name in "${required_env[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not defined for environment ${{ job.environment.name }}."
              exit 1
            fi
          done
          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "::error::Missing image tag from build job output."
            exit 1
          fi
          if [ -n "${STRAPI_REVALIDATE_URL:-}" ] && [ -z "${STRAPI_REVALIDATE_SECRET:-}" ] && [ -z "${STRAPI_REVALIDATE_SECRET_ARN:-}" ]; then
            echo "::error::Provide STRAPI_REVALIDATE_SECRET or STRAPI_REVALIDATE_SECRET_ARN when STRAPI_REVALIDATE_URL is defined."
            exit 1
          fi
          if [ -n "${STRAPI_DEPLOYMENT_WEBHOOK_URL:-}" ] && [ -z "${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN:-}" ] && [ -z "${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN:-}" ]; then
            echo "::error::Provide STRAPI_DEPLOYMENT_WEBHOOK_TOKEN or STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN when STRAPI_DEPLOYMENT_WEBHOOK_URL is defined."
            exit 1
          fi
          if [ -z "${STRAPI_HEALTHCHECK_URL:-}" ]; then
            echo "::warning::STRAPI_HEALTHCHECK_URL not configured; health verification step will be skipped."
          fi

      - name: Determine deployment strategy
        run: |
          set -euo pipefail
          if [ -n "${STRAPI_CODEDEPLOY_APPLICATION:-}" ] && [ -n "${STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP:-}" ] && [ -n "${STRAPI_TASK_DEFINITION_FAMILY:-}" ]; then
            echo "Using CodeDeploy blue/green rollout."
            echo "USE_CODEDEPLOY=true" >> "$GITHUB_ENV"
          else
            if [ -n "${STRAPI_CODEDEPLOY_APPLICATION:-}" ] || [ -n "${STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP:-}" ] || [ -n "${STRAPI_TASK_DEFINITION_FAMILY:-}" ]; then
              echo "::warning::Partial CodeDeploy configuration detected. Provide STRAPI_CODEDEPLOY_APPLICATION, STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP, and STRAPI_TASK_DEFINITION_FAMILY to enable blue/green rollouts."
            fi
            echo "USE_CODEDEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STRAPI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.STRAPI_AWS_REGION }}
      - name: Load deployment secrets
        run: |
          set -euo pipefail

          fetch_secret() {
            local env_key="$1"
            local arn="$2"
            if [ -z "${arn:-}" ]; then
              return
            fi
            echo "Fetching ${env_key} from AWS Secrets Manager"
            local secret_string
            local secret_binary
            local tmp_err
            tmp_err=$(mktemp)
            secret_string=$(aws secretsmanager get-secret-value --secret-id "${arn}" --query 'SecretString' --output text 2>"${tmp_err}" || true)
            if [ "${secret_string}" = "None" ] || [ -z "${secret_string}" ]; then
              secret_binary=$(aws secretsmanager get-secret-value --secret-id "${arn}" --query 'SecretBinary' --output text 2>>"${tmp_err}" || true)
              if [ "${secret_binary}" = "None" ] || [ -z "${secret_binary}" ]; then
                echo "::error::Failed to retrieve ${env_key} from ${arn}"
                if [ -s "${tmp_err}" ]; then
                  cat "${tmp_err}" >&2
                fi
                rm -f "${tmp_err}"
                exit 1
              fi
              secret_string=$(echo "${secret_binary}" | base64 --decode)
            fi
            echo "::add-mask::${secret_string}"
            {
              echo "${env_key}<<__STRAPI_SECRET__"
              echo "${secret_string}"
              echo "__STRAPI_SECRET__"
            } >> "$GITHUB_ENV"
            rm -f "${tmp_err}"
          }

          fetch_secret "STRAPI_REVALIDATE_SECRET" "${STRAPI_REVALIDATE_SECRET_ARN:-}"
          fetch_secret "STRAPI_DEPLOYMENT_WEBHOOK_TOKEN" "${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN:-}"
          if [ -z "${STRAPI_MIGRATION_COMMAND:-}" ]; then
            fetch_secret "STRAPI_MIGRATION_COMMAND" "${STRAPI_MIGRATION_COMMAND_SECRET_ARN:-}"
          fi

      - name: Promote image alias
        run: |
          set -euo pipefail
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${STRAPI_ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageManifest' \
            --output text)
          if [ -z "${MANIFEST}" ] || [ "${MANIFEST}" = "None" ]; then
            echo "::error::Unable to pull image manifest for ${IMAGE_TAG}"
            exit 1
          fi
          aws ecr put-image \
            --repository-name "${STRAPI_ECR_REPOSITORY}" \
            --image-tag "dev" \
            --image-manifest "${MANIFEST}"

      - name: Register task definition revision (CodeDeploy)
        id: register_task_definition
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY == 'true'
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required for CodeDeploy rollouts."
            exit 1
          fi

          if [ -z "${STRAPI_TASK_DEFINITION_FAMILY:-}" ]; then
            echo "::error::STRAPI_TASK_DEFINITION_FAMILY must be set when using CodeDeploy."
            exit 1
          fi

          IMAGE_REFERENCE="${STRAPI_ECR_REGISTRY}/${STRAPI_ECR_REPOSITORY}:${IMAGE_TAG}"
          CONTAINER_NAME="${STRAPI_CONTAINER_NAME:-strapi}"

          aws ecs describe-task-definition \
            --task-definition "${STRAPI_TASK_DEFINITION_FAMILY}" \
            --query 'taskDefinition' \
            --output json > task-definition.json

          if [ ! -s task-definition.json ]; then
            echo "::error::Failed to resolve base task definition ${STRAPI_TASK_DEFINITION_FAMILY}"
            exit 1
          fi

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt, .inferenceAccelerators)' task-definition.json \
            | jq --arg image "${IMAGE_REFERENCE}" --arg name "${CONTAINER_NAME}" '
              if (.containerDefinitions[] | select(.name == $name)) then
                (.containerDefinitions[] | select(.name == $name) | .image) = $image
              else
                error("Container named " + $name + " not found in task definition.")
              end
            ' > sanitized-task-definition.json

          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://sanitized-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "${NEW_TASK_DEFINITION}" ] || [ "${NEW_TASK_DEFINITION}" = "None" ]; then
            echo "::error::Task definition registration returned empty ARN."
            exit 1
          fi

          echo "REGISTERED_TASK_DEFINITION=${NEW_TASK_DEFINITION}" >> "$GITHUB_ENV"
          echo "registered-task-definition=${NEW_TASK_DEFINITION}" >> "$GITHUB_OUTPUT"

          rm -f task-definition.json sanitized-task-definition.json

      - name: Create CodeDeploy deployment
        id: create_codedeploy
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY == 'true'
        run: |
          set -euo pipefail

          if [ -z "${REGISTERED_TASK_DEFINITION:-}" ]; then
            echo "::error::REGISTERED_TASK_DEFINITION is not set."
            exit 1
          fi

          CONTAINER_NAME="${STRAPI_CONTAINER_NAME:-strapi}"
          CONTAINER_PORT="${STRAPI_CONTAINER_PORT:-1337}"

          APP_SPEC=$(jq -n \
            --arg taskDef "${REGISTERED_TASK_DEFINITION}" \
            --arg containerName "${CONTAINER_NAME}" \
            --argjson containerPort "${CONTAINER_PORT:-1337}" \
            '{version:1, Resources:[{TargetService:{Type:"AWS::ECS::Service", Properties:{TaskDefinition:$taskDef, LoadBalancerInfo:{ContainerName:$containerName, ContainerPort:$containerPort}}}}]}')

          jq -n \
            --arg app "${STRAPI_CODEDEPLOY_APPLICATION}" \
            --arg group "${STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP}" \
            --arg desc "Clarivum Strapi ${DEPLOYMENT_ENVIRONMENT} ${IMAGE_TAG}" \
            --arg content "${APP_SPEC}" \
            '{applicationName:$app, deploymentGroupName:$group, description:$desc, revision:{revisionType:"AppSpecContent", appSpecContent:{content:$content}}}' \
            > create-deployment.json

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --cli-input-json file://create-deployment.json \
            --query 'deploymentId' \
            --output text)

          if [ -z "${DEPLOYMENT_ID}" ] || [ "${DEPLOYMENT_ID}" = "None" ]; then
            echo "::error::Failed to create CodeDeploy deployment."
            exit 1
          fi

          echo "CODEDEPLOY_DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "codedeploy-deployment-id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

          rm -f create-deployment.json

      - name: Wait for CodeDeploy deployment
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY == 'true'
        run: |
          set -euo pipefail
          aws deploy wait deployment-successful --deployment-id "${CODEDEPLOY_DEPLOYMENT_ID}"
          aws deploy get-deployment --deployment-id "${CODEDEPLOY_DEPLOYMENT_ID}"

      - name: Run pre-deploy migrations
        if: env.RUN_MIGRATIONS == 'true'
        run: |
          set -euo pipefail
          if [ -n "${STRAPI_MIGRATION_COMMAND:-}" ]; then
            echo "::group::Executing migration command"
            bash -lc "${STRAPI_MIGRATION_COMMAND}"
            echo "::endgroup::"
          elif [ -x "cms/scripts/predeploy.sh" ]; then
            echo "::group::Executing cms/scripts/predeploy.sh"
            cms/scripts/predeploy.sh
            echo "::endgroup::"
          else
            echo "No migration command configured; skipping."
          fi

      - name: Update ECS service
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY != 'true'
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${STRAPI_CLUSTER_ARN}" \
            --service "${STRAPI_SERVICE_NAME}" \
            --force-new-deployment >/tmp/deploy.json
          cat /tmp/deploy.json

      - name: Wait for service stability
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY != 'true'
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${STRAPI_CLUSTER_ARN}" \
            --services "${STRAPI_SERVICE_NAME}"

      - name: Health check
        run: |
          if [ -z "${STRAPI_HEALTHCHECK_URL:-}" ]; then
            echo "No STRAPI_HEALTHCHECK_URL configured; skipping."
            exit 0
          fi
          echo "Polling ${STRAPI_HEALTHCHECK_URL}"
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 10 \
            "${STRAPI_HEALTHCHECK_URL}"

      - name: Trigger frontend revalidation
        run: |
          if [ -z "${STRAPI_REVALIDATE_URL:-}" ]; then
            echo "No STRAPI_REVALIDATE_URL configured; skipping."
            exit 0
          fi
          if [ -z "${STRAPI_REVALIDATE_SECRET:-}" ]; then
            echo "::warning::STRAPI_REVALIDATE_SECRET not set; skipping revalidation call."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${STRAPI_REVALIDATE_SECRET}" \
            "${STRAPI_REVALIDATE_URL}"

      - name: Run post-deploy smoke tests
        if: env.PROMOTE_ONLY != 'true'
        run: node scripts/strapi-smoke.mjs
        env:
          STRAPI_SMOKE_TEST_URLS: ${{ env.STRAPI_SMOKE_TEST_URLS }}
          STRAPI_HEALTHCHECK_URL: ${{ env.STRAPI_HEALTHCHECK_URL }}

      - name: Emit deployment observability event
        if: env.STRAPI_DEPLOYMENT_WEBHOOK_URL != '' && env.STRAPI_DEPLOYMENT_WEBHOOK_TOKEN != ''
        env:
          DEPLOYMENT_SERVICE: clarivum-strapi
        run: |
          set -euo pipefail
          export DEPLOYMENT_IMAGE="${STRAPI_ECR_REGISTRY}/${STRAPI_ECR_REPOSITORY}:${IMAGE_TAG}"
          payload=$(node --eval '
            const env = process.env;
            const workflowUrl = env.GITHUB_SERVER_URL && env.GITHUB_REPOSITORY && env.GITHUB_RUN_ID
              ? `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`
              : undefined;
            const body = {
              service: env.DEPLOYMENT_SERVICE,
              environment: env.DEPLOYMENT_ENVIRONMENT ?? "unknown",
              status: "success",
              version: env.IMAGE_TAG,
              image: env.DEPLOYMENT_IMAGE,
              digest: env.IMAGE_DIGEST || undefined,
              sha: env.GITHUB_SHA,
              workflowUrl,
              triggeredAt: new Date().toISOString(),
              metadata: {
                runMigrations: env.RUN_MIGRATIONS === "true",
                promoteOnly: env.PROMOTE_ONLY === "true",
              },
            };
            console.log(JSON.stringify(body));
          ')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "${STRAPI_DEPLOYMENT_WEBHOOK_URL}"

  deploy-manual:
    name: Deploy to ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: strapi-${{ inputs.environment }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations && 'true' || 'false' }}
      PROMOTE_ONLY: ${{ inputs.promote_only && 'true' || 'false' }}
      IMAGE_DIGEST: ""
      STRAPI_CLUSTER_ARN: ${{ vars.STRAPI_CLUSTER_ARN }}
      STRAPI_SERVICE_NAME: ${{ vars.STRAPI_SERVICE_NAME }}
      STRAPI_HEALTHCHECK_URL: ${{ vars.STRAPI_HEALTHCHECK_URL }}
      STRAPI_REVALIDATE_URL: ${{ vars.STRAPI_REVALIDATE_URL }}
      STRAPI_DEPLOYMENT_WEBHOOK_URL: ${{ vars.STRAPI_DEPLOYMENT_WEBHOOK_URL }}
      STRAPI_MIGRATION_COMMAND: ${{ vars.STRAPI_MIGRATION_COMMAND }}
      STRAPI_MIGRATION_COMMAND_SECRET_ARN: ${{ vars.STRAPI_MIGRATION_COMMAND_SECRET_ARN }}
      STRAPI_REVALIDATE_SECRET_ARN: ${{ vars.STRAPI_REVALIDATE_SECRET_ARN }}
      STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN: ${{ vars.STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN }}
      STRAPI_CODEDEPLOY_APPLICATION: ${{ vars.STRAPI_CODEDEPLOY_APPLICATION }}
      STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP }}
      STRAPI_TASK_DEFINITION_FAMILY: ${{ vars.STRAPI_TASK_DEFINITION_FAMILY }}
      STRAPI_CONTAINER_NAME: ${{ vars.STRAPI_CONTAINER_NAME }}
      STRAPI_CONTAINER_PORT: ${{ vars.STRAPI_CONTAINER_PORT }}
      STRAPI_SMOKE_TEST_URLS: ${{ vars.STRAPI_SMOKE_TEST_URLS }}
      STRAPI_DEPLOYMENT_WEBHOOK_TOKEN: ""
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment configuration
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "::error::workflow_dispatch requires the image_tag input."
            exit 1
          fi
          required_env=(
            STRAPI_CLUSTER_ARN
            STRAPI_SERVICE_NAME
          )
          for name in "${required_env[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not defined for environment ${{ job.environment.name }}."
              exit 1
            fi
          done
          if [ -n "${STRAPI_REVALIDATE_URL:-}" ] && [ -z "${STRAPI_REVALIDATE_SECRET:-}" ] && [ -z "${STRAPI_REVALIDATE_SECRET_ARN:-}" ]; then
            echo "::error::Provide STRAPI_REVALIDATE_SECRET or STRAPI_REVALIDATE_SECRET_ARN when STRAPI_REVALIDATE_URL is defined."
            exit 1
          fi
          if [ -n "${STRAPI_DEPLOYMENT_WEBHOOK_URL:-}" ] && [ -z "${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN:-}" ] && [ -z "${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN:-}" ]; then
            echo "::error::Provide STRAPI_DEPLOYMENT_WEBHOOK_TOKEN or STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN when STRAPI_DEPLOYMENT_WEBHOOK_URL is defined."
            exit 1
          fi
          if [ -z "${STRAPI_HEALTHCHECK_URL:-}" ]; then
            echo "::warning::STRAPI_HEALTHCHECK_URL not configured; health verification step will be skipped."
          fi

      - name: Determine deployment strategy
        run: |
          set -euo pipefail
          if [ -n "${STRAPI_CODEDEPLOY_APPLICATION:-}" ] && [ -n "${STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP:-}" ] && [ -n "${STRAPI_TASK_DEFINITION_FAMILY:-}" ]; then
            echo "Using CodeDeploy blue/green rollout."
            echo "USE_CODEDEPLOY=true" >> "$GITHUB_ENV"
          else
            if [ -n "${STRAPI_CODEDEPLOY_APPLICATION:-}" ] || [ -n "${STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP:-}" ] || [ -n "${STRAPI_TASK_DEFINITION_FAMILY:-}" ]; then
              echo "::warning::Partial CodeDeploy configuration detected. Provide STRAPI_CODEDEPLOY_APPLICATION, STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP, and STRAPI_TASK_DEFINITION_FAMILY to enable blue/green rollouts."
            fi
            echo "USE_CODEDEPLOY=false" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STRAPI_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.STRAPI_AWS_REGION }}
      - name: Load deployment secrets
        run: |
          set -euo pipefail

          fetch_secret() {
            local env_key="$1"
            local arn="$2"
            if [ -z "${arn:-}" ]; then
              return
            fi
            echo "Fetching ${env_key} from AWS Secrets Manager"
            local secret_string
            local secret_binary
            local tmp_err
            tmp_err=$(mktemp)
            secret_string=$(aws secretsmanager get-secret-value --secret-id "${arn}" --query 'SecretString' --output text 2>"${tmp_err}" || true)
            if [ "${secret_string}" = "None" ] || [ -z "${secret_string}" ]; then
              secret_binary=$(aws secretsmanager get-secret-value --secret-id "${arn}" --query 'SecretBinary' --output text 2>>"${tmp_err}" || true)
              if [ "${secret_binary}" = "None" ] || [ -z "${secret_binary}" ]; then
                echo "::error::Failed to retrieve ${env_key} from ${arn}"
                if [ -s "${tmp_err}" ]; then
                  cat "${tmp_err}" >&2
                fi
                rm -f "${tmp_err}"
                exit 1
              fi
              secret_string=$(echo "${secret_binary}" | base64 --decode)
            fi
            echo "::add-mask::${secret_string}"
            {
              echo "${env_key}<<__STRAPI_SECRET__"
              echo "${secret_string}"
              echo "__STRAPI_SECRET__"
            } >> "$GITHUB_ENV"
            rm -f "${tmp_err}"
          }

          fetch_secret "STRAPI_REVALIDATE_SECRET" "${STRAPI_REVALIDATE_SECRET_ARN:-}"
          fetch_secret "STRAPI_DEPLOYMENT_WEBHOOK_TOKEN" "${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN_ARN:-}"
          if [ -z "${STRAPI_MIGRATION_COMMAND:-}" ]; then
            fetch_secret "STRAPI_MIGRATION_COMMAND" "${STRAPI_MIGRATION_COMMAND_SECRET_ARN:-}"
          fi

      - name: Promote image alias
        run: |
          set -euo pipefail
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${STRAPI_ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'images[0].imageManifest' \
            --output text)
          if [ -z "${MANIFEST}" ] || [ "${MANIFEST}" = "None" ]; then
            echo "::error::Unable to pull image manifest for ${IMAGE_TAG}"
            exit 1
          fi
          aws ecr put-image \
            --repository-name "${STRAPI_ECR_REPOSITORY}" \
            --image-tag "${{ inputs.environment }}" \
            --image-manifest "${MANIFEST}"

      - name: Register task definition revision (CodeDeploy)
        id: register_task_definition_manual
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY == 'true'
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required for CodeDeploy rollouts."
            exit 1
          fi

          if [ -z "${STRAPI_TASK_DEFINITION_FAMILY:-}" ]; then
            echo "::error::STRAPI_TASK_DEFINITION_FAMILY must be set when using CodeDeploy."
            exit 1
          fi

          IMAGE_REFERENCE="${STRAPI_ECR_REGISTRY}/${STRAPI_ECR_REPOSITORY}:${IMAGE_TAG}"
          CONTAINER_NAME="${STRAPI_CONTAINER_NAME:-strapi}"

          aws ecs describe-task-definition \
            --task-definition "${STRAPI_TASK_DEFINITION_FAMILY}" \
            --query 'taskDefinition' \
            --output json > task-definition.json

          if [ ! -s task-definition.json ]; then
            echo "::error::Failed to resolve base task definition ${STRAPI_TASK_DEFINITION_FAMILY}"
            exit 1
          fi

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt, .inferenceAccelerators)' task-definition.json \
            | jq --arg image "${IMAGE_REFERENCE}" --arg name "${CONTAINER_NAME}" '
              if (.containerDefinitions[] | select(.name == $name)) then
                (.containerDefinitions[] | select(.name == $name) | .image) = $image
              else
                error("Container named " + $name + " not found in task definition.")
              end
            ' > sanitized-task-definition.json

          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://sanitized-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [ -z "${NEW_TASK_DEFINITION}" ] || [ "${NEW_TASK_DEFINITION}" = "None" ]; then
            echo "::error::Task definition registration returned empty ARN."
            exit 1
          fi

          echo "REGISTERED_TASK_DEFINITION=${NEW_TASK_DEFINITION}" >> "$GITHUB_ENV"
          echo "registered-task-definition=${NEW_TASK_DEFINITION}" >> "$GITHUB_OUTPUT"

          rm -f task-definition.json sanitized-task-definition.json

      - name: Create CodeDeploy deployment
        id: create_codedeploy_manual
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY == 'true'
        run: |
          set -euo pipefail

          if [ -z "${REGISTERED_TASK_DEFINITION:-}" ]; then
            echo "::error::REGISTERED_TASK_DEFINITION is not set."
            exit 1
          fi

          CONTAINER_NAME="${STRAPI_CONTAINER_NAME:-strapi}"
          CONTAINER_PORT="${STRAPI_CONTAINER_PORT:-1337}"

          APP_SPEC=$(jq -n \
            --arg taskDef "${REGISTERED_TASK_DEFINITION}" \
            --arg containerName "${CONTAINER_NAME}" \
            --argjson containerPort "${CONTAINER_PORT:-1337}" \
            '{version:1, Resources:[{TargetService:{Type:"AWS::ECS::Service", Properties:{TaskDefinition:$taskDef, LoadBalancerInfo:{ContainerName:$containerName, ContainerPort:$containerPort}}}}]}')

          jq -n \
            --arg app "${STRAPI_CODEDEPLOY_APPLICATION}" \
            --arg group "${STRAPI_CODEDEPLOY_DEPLOYMENT_GROUP}" \
            --arg desc "Clarivum Strapi ${DEPLOYMENT_ENVIRONMENT} ${IMAGE_TAG}" \
            --arg content "${APP_SPEC}" \
            '{applicationName:$app, deploymentGroupName:$group, description:$desc, revision:{revisionType:"AppSpecContent", appSpecContent:{content:$content}}}' \
            > create-deployment.json

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --cli-input-json file://create-deployment.json \
            --query 'deploymentId' \
            --output text)

          if [ -z "${DEPLOYMENT_ID}" ] || [ "${DEPLOYMENT_ID}" = "None" ]; then
            echo "::error::Failed to create CodeDeploy deployment."
            exit 1
          fi

          echo "CODEDEPLOY_DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "codedeploy-deployment-id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"

          rm -f create-deployment.json

      - name: Wait for CodeDeploy deployment
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY == 'true'
        run: |
          set -euo pipefail
          aws deploy wait deployment-successful --deployment-id "${CODEDEPLOY_DEPLOYMENT_ID}"
          aws deploy get-deployment --deployment-id "${CODEDEPLOY_DEPLOYMENT_ID}"

      - name: Run pre-deploy migrations
        if: env.RUN_MIGRATIONS == 'true'
        run: |
          set -euo pipefail
          if [ -n "${STRAPI_MIGRATION_COMMAND:-}" ]; then
            echo "::group::Executing migration command"
            bash -lc "${STRAPI_MIGRATION_COMMAND}"
            echo "::endgroup::"
          elif [ -x "cms/scripts/predeploy.sh" ]; then
            echo "::group::Executing cms/scripts/predeploy.sh"
            cms/scripts/predeploy.sh
            echo "::endgroup::"
          else
            echo "No migration command configured; skipping."
          fi

      - name: Update ECS service
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY != 'true'
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${STRAPI_CLUSTER_ARN}" \
            --service "${STRAPI_SERVICE_NAME}" \
            --force-new-deployment >/tmp/deploy.json
          cat /tmp/deploy.json

      - name: Wait for service stability
        if: env.PROMOTE_ONLY != 'true' && env.USE_CODEDEPLOY != 'true'
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "${STRAPI_CLUSTER_ARN}" \
            --services "${STRAPI_SERVICE_NAME}"

      - name: Health check
        if: env.PROMOTE_ONLY != 'true'
        run: |
          if [ -z "${STRAPI_HEALTHCHECK_URL:-}" ]; then
            echo "No STRAPI_HEALTHCHECK_URL configured; skipping."
            exit 0
          fi
          echo "Polling ${STRAPI_HEALTHCHECK_URL}"
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 10 \
            "${STRAPI_HEALTHCHECK_URL}"

      - name: Trigger frontend revalidation
        run: |
          if [ -z "${STRAPI_REVALIDATE_URL:-}" ]; then
            echo "No STRAPI_REVALIDATE_URL configured; skipping."
            exit 0
          fi
          if [ -z "${STRAPI_REVALIDATE_SECRET:-}" ]; then
            echo "::warning::STRAPI_REVALIDATE_SECRET not set; skipping revalidation call."
            exit 0
          fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${STRAPI_REVALIDATE_SECRET}" \
            "${STRAPI_REVALIDATE_URL}"

      - name: Run post-deploy smoke tests
        if: env.PROMOTE_ONLY != 'true'
        run: node scripts/strapi-smoke.mjs
        env:
          STRAPI_SMOKE_TEST_URLS: ${{ env.STRAPI_SMOKE_TEST_URLS }}
          STRAPI_HEALTHCHECK_URL: ${{ env.STRAPI_HEALTHCHECK_URL }}

      - name: Emit deployment observability event
        if: env.STRAPI_DEPLOYMENT_WEBHOOK_URL != '' && env.STRAPI_DEPLOYMENT_WEBHOOK_TOKEN != ''
        env:
          DEPLOYMENT_SERVICE: clarivum-strapi
        run: |
          set -euo pipefail
          export DEPLOYMENT_IMAGE="${STRAPI_ECR_REGISTRY}/${STRAPI_ECR_REPOSITORY}:${IMAGE_TAG}"
          payload=$(node --eval '
            const env = process.env;
            const workflowUrl = env.GITHUB_SERVER_URL && env.GITHUB_REPOSITORY && env.GITHUB_RUN_ID
              ? `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`
              : undefined;
            const body = {
              service: env.DEPLOYMENT_SERVICE,
              environment: env.DEPLOYMENT_ENVIRONMENT ?? "unknown",
              status: "success",
              version: env.IMAGE_TAG,
              image: env.DEPLOYMENT_IMAGE,
              digest: env.IMAGE_DIGEST || undefined,
              sha: env.GITHUB_SHA,
              workflowUrl,
              triggeredAt: new Date().toISOString(),
              metadata: {
                runMigrations: env.RUN_MIGRATIONS === "true",
                promoteOnly: env.PROMOTE_ONLY === "true",
              },
            };
            console.log(JSON.stringify(body));
          ')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${STRAPI_DEPLOYMENT_WEBHOOK_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${payload}" \
            "${STRAPI_DEPLOYMENT_WEBHOOK_URL}"
